# 抖音下载器配置模板(复制为 config.yml 使用)
# 服务端实际只消费以下键;多余的键会被静默忽略。

# HTTP 代理(如 "http://127.0.0.1:7890"),留空直连
proxy: ""

# 视频下载画质。抖音 API 为每个视频返回多档码率,此选项决定选用哪一档:
#   highest                  - 最高可用档(默认,与历史行为一致)
#   lowest                   - 最低可用档(省流量)
#   1440p / 1080p / 720p / 540p / 480p / 360p
#                            - 指定分辨率,匹配不到时自动降级到最接近的可用档
video_quality: highest

# 图集(/note/ 链接)「合成视频下载」用的 ffmpeg 路径。
# 留空时自动在 PATH 里找 ffmpeg;找不到则该功能返回错误提示(「下载图片」不受影响)。
# 服务器上安装:apt install ffmpeg。也可用环境变量 DOUYIN_FFMPEG_PATH 覆盖。
ffmpeg_path: ""

# REST API 服务
server:
  # 跨域允许的来源。自托管前端 / 旧版 WebView APK 时需要。
  # 留空用默认(含 Vite 开发与常见 WebView 来源);填 ["*"] 全放开。
  # 原生安卓 App(android-app/)走 OkHttp,不受浏览器 CORS 限制。
  cors_origins: []

# Web 控制台登录凭据
auth:
  username: xuziyue
  password: mmjsxu666555
  # HMAC 签名密钥。留空会在启动时生成临时密钥(重启后所有 token 失效)。
  # 生产建议填随机字符串:openssl rand -base64 32
  secret: ""
  # 额外账号(可选);所有账号共享同一个 secret
  # users:
  #   - username: alice
  #     password: alice-pwd

# 抖音登录 Cookie 三种写法任选其一:
# 1) 键值对:
# cookies:
#   ttwid: YOUR_TTWID
#   odin_tt: YOUR_ODIN_TT
# 2) 整串字符串:
# cookie: "ttwid=xxx; odin_tt=yyy"
# 3) 自动读取 .cookies.json / config/cookies.json:
# auto_cookie: true
