# 仅启动官方 nginx 镜像:托管前端构建产物(server/static)+ 反代 /api 到宿主机后端。
# 后端不在容器里,由 docker/start.sh 用 conda env `dogs` 在宿主机直接运行,
# 监听 127.0.0.1:8000。
#
# 因此 nginx 用 host 网络:与宿主机共享网络栈,可直接访问 127.0.0.1:8000,
# 且后端只绑 loopback、不对外暴露(外网只开 80)。
#
# 运行(在仓库根):docker compose -f docker/docker-compose.yml up -d
# 通常由 docker/start.sh 调用。
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dydl-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      # 前端构建产物(start.sh 先 npm run build 生成)
      - ../server/static:/usr/share/nginx/html:ro
      # nginx 配置:SPA 兜底 + /api 流式反代
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # host 网络模式下 ports 无效;nginx 直接 listen 宿主机 80。
