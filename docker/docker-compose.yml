# 抖音下载器 · 前端容器(参照 calendar-site 模式)
#
# 官方 nginx 镜像 + volume 挂载,无 Dockerfile、不构建镜像。
# 只绑 127.0.0.1:8083(loopback),不占 80/443,不碰 edge-nginx 现有配置。
# 由 edge-nginx(独占公网 80/443)做 TLS 终结并反代 douyin.xuziyue.work:
#     location /      → 本容器 127.0.0.1:8083(SPA)
#     location /api/  → 后端   127.0.0.1:8000(conda dogs, run.py --serve)
# (edge-nginx 的 server block 见 docker/edge-proxy/douyin.xuziyue.work.conf)
services:
  nginx:
    image: nginx:latest
    container_name: douyin-web
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      # 前端构建产物(start.sh 先 npm run build 生成)
      - ../server/static:/usr/share/nginx/html:ro
      # 站点配置覆盖官方 default.conf(纯静态托管)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
