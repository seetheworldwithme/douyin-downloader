# douyin.xuziyue.work —— 由 edge-nginx 做 TLS 终结,反代到:
#     /      → 前端容器 douyin-web (127.0.0.1:8083,官方 nginx 托管 SPA)
#     /api/  → 后端 Go server (127.0.0.1:8000, server-go)
#
# 部署:复制到 edge-nginx 的 conf.d 目录(与 edge.conf 并列,不动 edge.conf):
#     cp docker/edge-proxy/douyin.xuziyue.work.conf /home/ubuntu/code/edge-proxy/conf.d/
#     docker exec edge-nginx nginx -t && docker exec edge-nginx nginx -s reload
# 证书 /etc/letsencrypt/live/douyin.xuziyue.work/ 已存在(edge-nginx 只读挂载 /etc/letsencrypt)。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name douyin.xuziyue.work;

    ssl_certificate     /etc/letsencrypt/live/douyin.xuziyue.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/douyin.xuziyue.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 前端 SPA
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API(流式视频下载:关闭缓冲、放宽超时,避免大视频被截断)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
