# 抖音下载器 · 前端容器 server block(纯静态托管;不处理 /api,由 edge-nginx 直代后端)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml application/wasm;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带 hash 的 assets → 强缓存 30 天
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js|woff2?|png|jpe?g|webp|avif|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 不强缓存,保证 PWA 更新即时生效
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML 不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # SPA 兜底:任意前端路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
