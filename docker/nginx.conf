# nginx 配置:托管 SPA + 反代 /api 到宿主机后端(127.0.0.1:8000)。
# 流式下载(/api/v1/stream)必须关闭缓冲、放宽超时,否则大视频会被 nginx 截断。
server {
    listen 80;
    server_name _;            # 域名由 DNS 解析到本机即可,无需在此指定

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;   # 不限制请求体

    # gzip 压缩静态资源(JS/CSS)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存(带 hash 的 assets 可长期缓存)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端(流式透传,支持长视频与进度)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频流式下载:禁缓冲 + 长超时,避免中断
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA 兜底:任意前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
