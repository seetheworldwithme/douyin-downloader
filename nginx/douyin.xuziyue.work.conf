# douyin.xuziyue.work —— 宿主机 nginx(直接 apt 安装,无 docker)
#   /      → 静态前端(server-go/static,由 start.sh 构建,nginx 直接托管)
#   /api/  → 后端 Go server(127.0.0.1:8000,server-go,流式视频下载)
# 证书:certbot webroot(/var/www/html)签发与续期,systemd timer 自动续。
#
# 部署(服务器上):
#   sudo cp nginx/douyin.xuziyue.work.conf /etc/nginx/sites-available/douyin.xuziyue.work
#   sudo ln -sf ../sites-available/douyin.xuziyue.work /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name douyin.xuziyue.work;

    # ACME 续期 challenge(certbot --webroot -w /var/www/html)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name douyin.xuziyue.work;

    ssl_certificate     /etc/letsencrypt/live/douyin.xuziyue.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/douyin.xuziyue.work/privkey.pem;

    root /mnt/disk/code/GoProject/douyin-downloader/server-go/static;
    index index.html;
    charset utf-8;

    # gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml application/wasm;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带 hash 的 assets → 强缓存 30 天
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js|woff2?|png|jpe?g|webp|avif|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 不强缓存,保证 PWA 更新即时生效
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML 不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 后端 API(流式视频下载:关闭缓冲、放宽超时,避免大视频被截断)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA 兜底:任意前端路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
